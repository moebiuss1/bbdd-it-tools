name: Actualización semanal y deploy

on:
  schedule:
    - cron: "7 6 * * 1"  # Cada lunes a las 06:07 UTC
  workflow_dispatch: {}    # Ejecución manual
  push:                    # Publicar también los cambios de código, no solo los datos
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

# Permisos por job (mínimo privilegio): solo el job que hace commit necesita
# escribir en el repositorio, y solo el de despliegue necesita tocar Pages.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # El pipeline de datos solo corre en la cita semanal (o a mano): un push de
  # código no debe salir a rastrear fuentes externas ni generar commits.
  update-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write   # el aviso semanal del estado del catálogo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias Python
        run: pip install -r scripts/requirements.txt

      - name: Buscar jugadores nuevos (API de GitHub y landscape de la CNCF)
        run: python scripts/fetch_candidates.py
        env:
          GITHUB_TOKEN: ${{ github.token }}   # sube el límite de la API de búsqueda
        continue-on-error: true # una fuente externa caída no debe frenar el pipeline

      - name: Crear/enriquecer fichas a partir de los candidatos descubiertos
        run: python scripts/enrich_tools.py --limit 20
        continue-on-error: true # datos incompletos se marcan needs_review, nunca deben romper el build

      - name: Reforzar datos semilla curados (nunca sobrescribe ediciones manuales)
        run: python scripts/seed_tools.py

      - name: Descargar logos
        run: python scripts/fetch_logos.py
        continue-on-error: true

      - name: Calcular rankings
        run: python scripts/compute_rankings.py

      - name: Validar datos
        run: python scripts/validate.py

      # Los fabricantes publican los cuadrantes en los que salen, casi siempre con
      # enlace a su mercado de Gartner Peer Insights. Es la única forma de obtener
      # esas URLs sin tocar Gartner, que responde 403 a todo.
      - name: Cosechar referencias de analistas de las webs de los fabricantes
        run: python scripts/scan_analyst_sources.py
        continue-on-error: true

      # Lo que ningún otro paso ve: que la herramienta haya dejado de existir.
      # El síntoma es que su web empiece a redirigir a otro dominio, como pasó
      # con Skybox (cerró y su dominio lo sirve Tufin) o con ForgeRock (absorbida
      # por Ping). Nunca falla el pipeline: deja un informe y se abre un aviso.
      - name: Vigilar el catálogo (cambios de dominio, fuentes, altas)
        run: python scripts/check_catalog_health.py

      - name: Abrir aviso si hay algo que revisar
        if: hashFiles('data/catalog-health.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titulo="Revisión del catálogo — $(date -u +%F)"
          # Se reutiliza el aviso abierto en lugar de crear uno por semana: el
          # historial de comentarios cuenta mejor la evolución que veinte issues.
          # `|| true`: si la etiqueta aún no existe, gh devuelve error y aquí
          # eso solo significa que hay que crear el primer aviso.
          abierto=$(gh issue list --state open --label catalogo --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" --body-file data/catalog-health.md
          else
            gh label create catalogo --color 0E8A16 --description "Avisos automáticos del estado del catálogo" 2>/dev/null || true
            gh issue create --title "$titulo" --label catalogo --body-file data/catalog-health.md
          fi

      - name: Commit cambios de datos
        run: |
          git config user.name "bbdd-it-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Sin cambios" || \
            git commit -m "chore(data): actualización semanal $(date -u +%F)"
          git push

  build:
    needs: update-data
    # `always()` permite construir cuando update-data se ha saltado (push de
    # código); si el pipeline de datos falla, no se publica nada.
    if: always() && needs.update-data.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Sin `ref`, el checkout tomaría el commit que disparó el workflow, que en
      # la ejecución semanal es anterior al commit de datos del bot: se
      # publicaban los datos de la semana pasada.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias Node
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
